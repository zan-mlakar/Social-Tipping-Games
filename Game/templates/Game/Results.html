{% extends "global/Page.html" %}
{% load otree static %}

{% block title %}
    <p style="text-align: center; color: #017AFF">The Product Launch Task</p>
{% endblock %}

{% block content %}

    <script src="https://code.highcharts.com/highcharts.js"></script>
    <div id="container" style="min-width: 310px; max-width: 400px; height: 300px; margin: 0 auto"></div>
    <script>
    Highcharts.chart('container', {
    chart: {
        plotBackgroundColor: null,
        plotBorderWidth: 0,
        plotShadow: false
    },
    title: {
        text: '<p font-size:20px"><b>Preferences in round {{ subsession.round_number }}:</b></p>',
        align: 'center',
        y: 80
    },
    credits: {
        enabled: false
    },
    tooltip: {
        pointFormat: '{series.name}: <b>{point.percentage:.1f}%</b>'
    },
    plotOptions: {
        pie: {
            dataLabels: {
                enabled: true,
                distance: -25,
                style: {
                    fontWeight: 'italic',
                    color: 'white'
                }
            },
            startAngle: -90,
            endAngle: 90,
            center: ['50%', '75%'],
            size: '100%'
        }
    },
    series: [{
        type: 'pie',
        name: 'Percentage of participants that chose the given name:',
        innerSize: '50%',
        data: [
            ['Tao ({{ chose_tao }}%)' , {{ chose_tao }}],
            ['Eta({{ chose_eta }}%)', {{ chose_eta }}],
        ]
    }],
});
    </script>

    <br>
    <div style="text-align: center">{% next_button %}</div>

    <style>
    .otree-timer {
        display: none;
    }
    </style>

{% endblock %}
